[project]
name = "new-marketplace"
version = "0.1.0"
description = ""
authors = [
    {name = "Ростислав Абрамцев",email = "Abramcevrostislav27@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "boto3 (>=1.43.118,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aio-pika (>=10.2.1,<11.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::ResourceWarning",
    "ignore:.*Event loop is closed.*:RuntimeWarning",
]